server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:

        # Auth service internal endpoints: service-to-service calls go straight
        # to AUTH-SERVICE by Eureka name (bypassing this Gateway entirely), so
        # making these JWT-protected here only stops public browsers from
        # reaching them — it can't break anything that legitimately uses them.
        - id: auth-service-internal
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/internal/**
          filters:
            - JwtAuthFilter

        # Auth service: public routes (login/register)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # User service: protected
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthFilter

        # Courier service: protected
        - id: courier-service
          uri: lb://COURIER-SERVICE
          predicates:
            - Path=/api/courier/**
          filters:
            - JwtAuthFilter

        # Fleet service: protected
        - id: fleet-service
          uri: lb://FLEET-SERVICE
          predicates:
            - Path=/api/fleet/**
          filters:
            - JwtAuthFilter

        # GPS Tracking service: protected
        - id: gps-service
          uri: lb://GPS-SERVICE
          predicates:
            - Path=/api/gps/**
          filters:
            - JwtAuthFilter

        # Matching service: protected
        - id: matching-service
          uri: lb://MATCHING-SERVICE
          predicates:
            - Path=/api/matching/**
          filters:
            - JwtAuthFilter

        # Notification service: protected
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter

        # Payment service: protected
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**
          filters:
            - JwtAuthFilter

        # Admin service: protected (controllers also enforce ADMIN role)
        - id: admin-service
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/admin/**
          filters:
            - JwtAuthFilter



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true