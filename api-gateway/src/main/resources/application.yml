server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          # no JwtAuthenticationFilter here — login/register must stay public

        - id: courier-service
          uri: lb://COURIER-SERVICE
          predicates:
            - Path=/api/couriers/**,/api/shipments/**
          filters:
            - JwtAuthenticationFilter

        - id: fleet-service
          uri: lb://FLEET-SERVICE
          predicates:
            - Path=/api/fleet/**,/api/trucks/**,/api/drivers/**
          filters:
            - JwtAuthenticationFilter

        - id: gps-service
          uri: lb://GPS-SERVICE
          predicates:
            - Path=/api/gps/**
          filters:
            - JwtAuthenticationFilter

        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**
          filters:
            - JwtAuthenticationFilter

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
