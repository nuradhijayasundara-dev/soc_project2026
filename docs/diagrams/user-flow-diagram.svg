<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <text x="500" y="32" fill="#212529" font-size="22" font-weight="bold" text-anchor="middle">Backhaul-Match — Main Demonstration Flow</text>
  <text x="500" y="52" fill="#6c757d" font-size="12" text-anchor="middle">The 11-step flow for the 2 August final demo</text>

  <defs>
    <marker id="uf-arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#495057"/>
    </marker>
  </defs>

  <!-- step template: (x,y) box, number, label, actor -->
  <!-- Step 1 -->
  <g>
    <circle cx="60" cy="90" r="22" fill="#0d6efd"/>
    <text x="60" y="97" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <rect x="100" y="65" width="420" height="50" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
    <text x="115" y="86" font-size="13" font-weight="bold" fill="#212529">Courier User Logs In</text>
    <text x="115" y="103" font-size="11" fill="#495057">Courier Portal → /login → POST /api/auth/login</text>
  </g>
  <line x1="60" y1="112" x2="60" y2="140" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 2 -->
  <g>
    <circle cx="60" cy="170" r="22" fill="#0d6efd"/>
    <text x="60" y="177" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <rect x="100" y="145" width="420" height="50" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
    <text x="115" y="166" font-size="13" font-weight="bold" fill="#212529">Creates Shipment</text>
    <text x="115" y="183" font-size="11" fill="#495057">Requests page → New Shipment form → POST /api/courier/shipments</text>
  </g>
  <line x1="60" y1="192" x2="60" y2="220" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 3 -->
  <g>
    <circle cx="60" cy="250" r="22" fill="#0d6efd"/>
    <text x="60" y="257" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <rect x="100" y="225" width="420" height="50" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
    <text x="115" y="246" font-size="13" font-weight="bold" fill="#212529">Requests Backhaul Transport</text>
    <text x="115" y="263" font-size="11" fill="#495057">Shipment Details → "Request Backhaul Transport" → POST /api/matching/requests</text>
  </g>
  <line x1="60" y1="272" x2="60" y2="300" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 4 -->
  <g>
    <circle cx="60" cy="330" r="22" fill="#f4a261"/>
    <text x="60" y="337" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <rect x="100" y="305" width="420" height="50" rx="8" fill="#fff3e6" stroke="#f4a261"/>
    <text x="115" y="326" font-size="13" font-weight="bold" fill="#212529">System Searches Available Trucks</text>
    <text x="115" y="343" font-size="11" fill="#495057">matching-service → fleet-service (route + capacity + distance filter)</text>
  </g>
  <line x1="60" y1="352" x2="60" y2="380" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 5 -->
  <g>
    <circle cx="60" cy="410" r="22" fill="#f4a261"/>
    <text x="60" y="417" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <rect x="100" y="385" width="420" height="50" rx="8" fill="#fff3e6" stroke="#f4a261"/>
    <text x="115" y="406" font-size="13" font-weight="bold" fill="#212529">Match Found</text>
    <text x="115" y="423" font-size="11" fill="#495057">Ranked results saved → MATCH_FOUND notification → Match Results page</text>
  </g>
  <line x1="60" y1="432" x2="60" y2="460" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 6 -->
  <g>
    <circle cx="60" cy="490" r="22" fill="#0d6efd"/>
    <text x="60" y="497" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <rect x="100" y="465" width="420" height="50" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
    <text x="115" y="486" font-size="13" font-weight="bold" fill="#212529">Courier Accepts Match</text>
    <text x="115" y="503" font-size="11" fill="#495057">"Accept Match" button → POST /api/matching/results/{id}/accept-match</text>
  </g>
  <line x1="60" y1="512" x2="60" y2="540" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 7 -->
  <g>
    <circle cx="60" cy="570" r="22" fill="#2a9d8f"/>
    <text x="60" y="577" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
    <rect x="100" y="545" width="420" height="50" rx="8" fill="#e7f7f5" stroke="#2a9d8f"/>
    <text x="115" y="566" font-size="13" font-weight="bold" fill="#212529">Fleet Company Receives Booking</text>
    <text x="115" y="583" font-size="11" fill="#495057">BOOKING_REQUESTED notification → Fleet Portal "Bookings" page</text>
  </g>
  <line x1="60" y1="592" x2="60" y2="620" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 8 -->
  <g>
    <circle cx="60" cy="650" r="22" fill="#f4a261"/>
    <text x="60" y="657" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">8</text>
    <rect x="100" y="625" width="420" height="50" rx="8" fill="#fff3e6" stroke="#f4a261"/>
    <text x="115" y="646" font-size="13" font-weight="bold" fill="#212529">Truck Capacity Is Reserved</text>
    <text x="115" y="663" font-size="11" fill="#495057">Already happened at step 6 — fleet-service flips the slot to BOOKED immediately</text>
  </g>
  <line x1="60" y1="672" x2="60" y2="700" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 9 -->
  <g>
    <circle cx="60" cy="730" r="22" fill="#2a9d8f"/>
    <text x="60" y="737" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">9</text>
    <rect x="100" y="705" width="420" height="50" rx="8" fill="#e7f7f5" stroke="#2a9d8f"/>
    <text x="115" y="726" font-size="13" font-weight="bold" fill="#212529">Driver Starts Trip</text>
    <text x="115" y="743" font-size="11" fill="#495057">Fleet assigns driver → Driver App "Start Trip" → PATCH /trips/{id}/start</text>
  </g>
  <line x1="60" y1="752" x2="60" y2="780" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 10 -->
  <g>
    <circle cx="60" cy="810" r="22" fill="#2a9d8f"/>
    <text x="60" y="817" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">10</text>
    <rect x="100" y="785" width="420" height="50" rx="8" fill="#e7f7f5" stroke="#2a9d8f"/>
    <text x="115" y="806" font-size="13" font-weight="bold" fill="#212529">GPS Location Updates Live</text>
    <text x="115" y="823" font-size="11" fill="#495057">Driver App streams position → gps-service → Fleet Portal's live map</text>
  </g>
  <line x1="520" y1="810" x2="580" y2="810" stroke="#495057" stroke-width="1.5" marker-end="url(#uf-arrow)"/>

  <!-- Step 11 (moved to right column to close the loop) -->
  <g>
    <circle cx="640" cy="810" r="22" fill="#0d6efd"/>
    <text x="640" y="817" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">11</text>
    <rect x="680" y="785" width="290" height="50" rx="8" fill="#e7f1ff" stroke="#0d6efd"/>
    <text x="695" y="806" font-size="13" font-weight="bold" fill="#212529">Courier Tracks Shipment</text>
    <text x="695" y="823" font-size="11" fill="#495057">Courier Portal "Tracking" page reads back live position</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#495057">
    <circle cx="700" cy="90" r="8" fill="#0d6efd"/><text x="715" y="94">Courier Portal action</text>
    <circle cx="700" cy="115" r="8" fill="#f4a261"/><text x="715" y="119">Backend / platform step</text>
    <circle cx="700" cy="140" r="8" fill="#2a9d8f"/><text x="715" y="144">Fleet Portal / Driver App action</text>
  </g>

  <rect x="600" y="170" width="370" height="130" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="615" y="192" font-size="12" font-weight="bold" fill="#212529">Full step-by-step click path:</text>
  <text x="615" y="212" font-size="10.5" fill="#495057">see docs/demo-script.md — includes exact screens,</text>
  <text x="615" y="228" font-size="10.5" fill="#495057">buttons, and API calls for each numbered step, plus</text>
  <text x="615" y="244" font-size="10.5" fill="#495057">a one-command seed script (testing/demo-seed.sh) to</text>
  <text x="615" y="260" font-size="10.5" fill="#495057">pre-create accounts/trucks so the live demo only needs</text>
  <text x="615" y="276" font-size="10.5" fill="#495057">to click through, not type out setup data on stage.</text>
</svg>
